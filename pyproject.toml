[project]
name = "courseforge-prompt-chaining"
version = "0.11.1"
description = "A teaching-first Prompt Chaining example built with LangChain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openrouter>=0.2.7,<0.3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
